[project]
name = "ultraq"
version = "0.1.0"
description = "Multiprogramming of quantum VMs (qVMs) on one chip, inspired by HyperQ (OSDI'25)"
readme = "README.md"
authors = [
    { name = "Camille Maisse", email = "camille.maise@epita.fr" },
    { name = "Clément Metz", email = "metz.clement@gmail.com" },
    { name = "Florian Flogliani", email = "florian.fogliani@epita.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "iqm-client[qiskit]>=37.0",
    "python-dotenv>=1.0",
    "qiskit>=2.1,<2.2",  # iqm-client 36 requires qiskit < 2.2
    "qiskit-aer>=0.17,<0.18",
    "rustworkx>=0.15",
]

[project.scripts]
benchmark = "benchmark.main:main"
duration = "scripts.duration:main"
fidelity = "scripts.fidelity:main"
throughput = "scripts.throughput:main"

[project.optional-dependencies]
benchmark = [
    "polars>=2.1.0",
    "pydantic-settings>=2.16.2",
    "pyqir>=0.12.8",  # requiered by qiskit-scaleway
    "qiskit-scaleway>=0.3.13",
]
plot = [
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "icecream>=2.2.0",
    "pytest>=8",
    "ruff>=0.17.3",
    "ty>=0.0.96",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "benchmark",
    "misc/HyperQ",
    "misc/QASMBench",
    "src/ultraq_backend",
    "src/ultraq_qiskit_connector"
]
