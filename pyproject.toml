[project]
name = "pfee-epita-qvm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Clément Metz", email = "metz.clement@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
pfee-epita-qvm = "pfee_epita_qvm:main"
benchmark = "benchmark.main:main"

[project.optional-dependencies]
benchmark = [
    "pydantic-settings>=2.16.2",
    "qiskit>=2.6.1",
    "qiskit-aer>=0.18.2",
    "qiskit-scaleway>=0.3.13",
]

[dependency-groups]
dev = [
    "icecream>=2.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.96",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "benchmark",
    "misc/HyperQ",
    "misc/QASMBench",
    "src/pfee-epita-qvm",
]
